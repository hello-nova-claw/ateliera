[package]
name = "studio-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "studio_desktop"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = "2.8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
