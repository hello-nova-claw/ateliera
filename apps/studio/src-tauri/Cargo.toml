[package]
name = "studio-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "studio_desktop"
path = "src/lib.rs"

[[bin]]
name = "studio-desktop"
path = "src/main.rs"

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
hex = "0.4"
libc = "0.2"
notify = "8.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = ["test"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"
