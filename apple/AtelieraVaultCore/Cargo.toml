[package]
name = "ateliera-vault-core"
version = "0.1.0"
edition = "2021"
description = "Portable Ateliera vault read core (cap-std), exposed to Swift via UniFFI. Read semantics match apps/studio/src-tauri/src/commands/vault.rs."

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "ateliera_vault_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
thiserror = "2"
