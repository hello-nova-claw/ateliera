name: Ateliera
options:
  bundleIdPrefix: au.com.annamcphee.ateliera
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: "4J2C587G89"
    CODE_SIGN_STYLE: Automatic
targets:
  Ateliera:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Ateliera
    dependencies:
      - framework: AtelieraVaultCore/VaultCore.xcframework
        embed: false
        codeSign: false
      - target: AtelieraWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.annamcphee.ateliera.native
        PRODUCT_NAME: Ateliera
        INFOPLIST_KEY_CFBundleDisplayName: Ateliera
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FoundationModels (Apple Intelligence, iOS/macOS 26+) is used only to personalise
        # the micro-season, gated behind #available and canImport. Weak-link it so the app
        # still launches on the iOS-17 deployment target where the framework is absent.
        OTHER_LDFLAGS: "-weak_framework FoundationModels"
        # HealthKit (iOS only — the framework isn't on macOS). The usage string is
        # required before requesting authorization; the entitlement is scoped to
        # the iOS SDKs so the macOS build/sign stays clean.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Ateliera reads your menstrual cycle from Health, on your device, to place today's rhythm. It never writes to Health."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Ateliera uses your location once to tell which hemisphere you're in, so the season and micro-season are right. It stays on your device."
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Ateliera.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Ateliera.entitlements
        # macOS ships the App Sandbox (Mac App Store) + user-selected-folder access
        # for the vault; HealthKit is iOS-only so it lives only in the iOS file.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Ateliera-macOS.entitlements
  # WidgetKit extension: a home-screen "Today's rhythm" almanac. Reuses the pure
  # rhythm engine + the App Group hemisphere; multiplatform so the Mac app can
  # embed it too.
  AtelieraWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: AtelieraWidgets
        excludes:
          - Info.plist
      - path: Ateliera/Rhythm/Rhythm.swift
      - path: Ateliera/Rhythm/Sky.swift
      - path: Ateliera/Intents/RhythmSummary.swift
      - path: Ateliera/Shared/SharedStore.swift
      # The widget names today's micro-season, so it bundles its own copy of that table.
      - path: Ateliera/Shared/ContentLibrary.swift
      - path: Ateliera/Content/micro-seasons.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.annamcphee.ateliera.native.widgets
        PRODUCT_NAME: AtelieraWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AtelieraWidgets/Info.plist
        SKIP_INSTALL: YES

  AtelieraTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: AtelieraTests
      # The accessibility audit's triage rules, so they have unit tests without a simulator.
      - path: AtelieraUITests/AuditTriage.swift
    dependencies:
      - target: Ateliera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.annamcphee.ateliera.native.tests
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen auto-sets TEST_HOST to the iOS bundle layout
        # (Ateliera.app/Ateliera); on macOS the host binary lives under
        # Contents/MacOS, so override it there to run the suite natively on Mac.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Ateliera.app/Contents/MacOS/Ateliera"
  # Drives the real capture/edit UI in the simulator (the button→FFI→vault→list
  # flow a headless unit test can't reach). iOS-only; run macOS with
  # -only-testing:AtelieraTests.
  AtelieraUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: AtelieraUITests
    dependencies:
      - target: Ateliera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.annamcphee.ateliera.native.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ateliera:
    build:
      targets:
        Ateliera: all
        AtelieraTests: [test]
        AtelieraUITests: [test]
    test:
      targets:
        - AtelieraTests
        - AtelieraUITests
