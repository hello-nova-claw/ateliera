name: Ateliera
options:
  bundleIdPrefix: au.com.annamcphee.ateliera
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Ateliera:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Ateliera
    dependencies:
      - framework: AtelieraVaultCore/VaultCore.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.annamcphee.ateliera.native
        PRODUCT_NAME: Ateliera
        INFOPLIST_KEY_CFBundleDisplayName: Ateliera
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  AtelieraTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: AtelieraTests
    dependencies:
      - target: Ateliera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.annamcphee.ateliera.native.tests
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen auto-sets TEST_HOST to the iOS bundle layout
        # (Ateliera.app/Ateliera); on macOS the host binary lives under
        # Contents/MacOS, so override it there to run the suite natively on Mac.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Ateliera.app/Contents/MacOS/Ateliera"
  # Drives the real capture/edit UI in the simulator (the button→FFI→vault→list
  # flow a headless unit test can't reach). iOS-only; run macOS with
  # -only-testing:AtelieraTests.
  AtelieraUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: AtelieraUITests
    dependencies:
      - target: Ateliera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.annamcphee.ateliera.native.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ateliera:
    build:
      targets:
        Ateliera: all
        AtelieraTests: [test]
        AtelieraUITests: [test]
    test:
      targets:
        - AtelieraTests
        - AtelieraUITests
