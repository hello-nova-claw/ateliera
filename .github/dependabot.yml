version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, no-changelog]
    commit-message:
      prefix: "Build/Test Tools:"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, no-changelog]
    commit-message:
      prefix: "Build/Test Tools:"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /apple/AtelieraVaultCore
      - /apps/studio/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, no-changelog]
    commit-message:
      prefix: "Build/Test Tools:"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
