name: Apple setup
description: Restores or creates the Rust toolchain, builds the vault core and generates the Xcode project.

runs:
  using: composite
  steps:
    - uses: actions/cache@v5.0.1
      with:
        path: |
          .toolchains
          apple/AtelieraVaultCore/target
        key: rust-${{ runner.os }}-${{ hashFiles('apple/AtelieraVaultCore/Cargo.lock', 'apple/AtelieraVaultCore/build.sh') }}
        restore-keys: rust-${{ runner.os }}-
    - name: Create the Rust toolchain
      shell: bash
      run: |
        if [ ! -x .toolchains/cargo/bin/cargo ]; then
          export CARGO_HOME="$PWD/.toolchains/cargo" RUSTUP_HOME="$PWD/.toolchains/rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          .toolchains/cargo/bin/rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin
        fi
    - name: Build the vault core and generate the project
      shell: bash
      working-directory: apple
      run: |
        brew install xcodegen
        ./AtelieraVaultCore/build.sh
        xcodegen generate
    # Some runners start with no simulators listed, and xcodebuild then finds no
    # destination. Restarting CoreSimulator usually brings them back.
    - name: Check the simulators are there
      shell: bash
      run: |
        for attempt in 1 2 3 4; do
          if xcrun simctl list devices available | sed -n '/-- iOS 26.5 --/,/^--/p' | grep -q 'iPhone 17 Pro ('; then
            exit 0
          fi
          [ "$attempt" = 4 ] && break
          echo "No iPhone 17 Pro on iOS 26.5 listed (attempt $attempt). Restarting CoreSimulator."
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
          sleep 20
        done
        echo "::error::This runner lists no iPhone 17 Pro on iOS 26.5. Rerun the job."
        exit 1
