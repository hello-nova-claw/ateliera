name: Pull request rules

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names are required-check names on main. Never rename one.
jobs:
  tests-with-code:
    name: Tests change with code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: node bin/pr-rules.mjs tests "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  changelog:
    name: Changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The event's labels can predate labels added a moment after opening, and
      # a rerun replays the same event, so only the labels as they are now count.
      - id: labels
        run: |
          labels=$(gh pr view "$NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if grep -qx no-changelog <<< "$labels"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
      - if: steps.labels.outputs.skip != 'true'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.labels.outputs.skip != 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - if: steps.labels.outputs.skip != 'true'
        run: node bin/pr-rules.mjs changelog "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  privacy-doc:
    name: Privacy doc changes with privacy files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: node bin/pr-rules.mjs privacy-doc "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
