name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share a group per branch; every other run gets its own.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The WebKit system packages come from the Ubuntu mirror, where a
      # download can stall for good. Time stalled fetches out and retry them.
      - name: Install Playwright browsers
        timeout-minutes: 15
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
          pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Dates are where this app breaks, so the unit tests also run in zones
      # east and west of UTC. The runner itself is on UTC.
      - name: Unit tests in other time zones
        run: |
          for zone in Australia/Melbourne America/Los_Angeles; do
            echo "Time zone: $zone"
            TZ="$zone" pnpm test
          done
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-evidence
          path: artifacts/playwright
          if-no-files-found: error
          retention-days: 30
