name: Apple screenshots comment

# Runs after "Apple" on the base repository's code. It keeps main's shots under main/
# on the screenshots branch, and for a pull request keeps only the shots that differ
# from main under pr-<n>/ and posts the Screenshots comment comparing them.
on:
  workflow_run:
    workflows: [Apple]
    types: [completed]

permissions:
  contents: read

# One push to the screenshots branch at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Screenshots comment
    # Only this repository's own branches, never a fork's, since the shots are
    # published as they are. Dependabot's runs get a read-only token, so they're skipped.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # Pull requests that don't change what's on screen take no shots.
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "ateliera-screenshots")] | length')
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # The default branch's code, so nothing from the pull request runs here.
      - uses: actions/checkout@v7.0.1
        if: steps.artifact.outputs.found == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        if: steps.artifact.outputs.found == 'true'
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.2
        if: steps.artifact.outputs.found == 'true'
        with:
          name: ateliera-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: shots
      - if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          target=$(sed -n 1p shots/target.txt)
          sha=$(sed -n 2p shots/target.txt)
          # The artifact comes from the pull request's code: accept only a target that
          # matches the run, and a pull request whose head is still this run's commit.
          if [ "$sha" != "$RUN_SHA" ]; then echo "::error::The shots aren't for this run."; exit 1; fi
          if [ "$EVENT" = push ]; then
            [ "$target" = main ] || { echo "::error::Bad target."; exit 1; }
          else
            case "$target" in ''|*[!0-9]*) echo "::error::Bad PR number."; exit 1;; esac
            head=$(gh api "repos/$REPO/pulls/$target" --jq .head.sha)
            if [ "$head" != "$RUN_SHA" ]; then echo "Run is not the PR's head; skipping."; exit 0; fi
          fi

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q branch
          cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/$REPO.git"
          if git -c http.extraheader="$auth" ls-remote --exit-code origin screenshots > /dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 origin screenshots
            git checkout -q -B screenshots FETCH_HEAD
          else
            git checkout -q --orphan screenshots
          fi

          if [ "$target" = main ]; then
            node ../bin/screenshots.mjs validate ../shots/images
            rm -rf main
            mkdir main
            cp ../shots/images/*.jpg main/
            message="Screenshots: main at ${RUN_SHA:0:7}."
          else
            node ../bin/screenshots.mjs stage main ../shots/images "pr-$target" > ../diff.json
            message="Screenshots: pull request $target at ${RUN_SHA:0:7}."
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "$message"
            git -c http.extraheader="$auth" push -q origin screenshots
          fi
          branch_sha=$(git rev-parse HEAD 2>/dev/null || true)
          cd ..
          [ "$target" = main ] && exit 0

          body=$(node bin/screenshots.mjs comment diff.json "$REPO" "$target" "$RUN_SHA" "$branch_sha")
          marker='<!-- ateliera-screenshots -->'
          existing=$(gh api "repos/$REPO/issues/$target/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$target/comments" -f body="$body" > /dev/null
          fi
