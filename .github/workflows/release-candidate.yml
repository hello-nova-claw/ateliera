name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'studio-v*'

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # dtolnay/rust-toolchain has no releases, so it is pinned to a commit of its stable branch.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/studio/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: pnpm verify:release

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: studio-release-evidence-${{ github.run_id }}
          path: artifacts/release-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Upload unsigned macOS bundle
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: studio-macos-unsigned-${{ github.run_id }}
          path: apps/studio/src-tauri/target/release/bundle
          if-no-files-found: warn
          retention-days: 30
